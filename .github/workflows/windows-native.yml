name: Windows Native App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "windows/**"
      - ".github/workflows/windows-native.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore windows/PulseMail.sln

      - name: Test Core
        run: dotnet test windows/src/PulseMail.Core.Tests/PulseMail.Core.Tests.csproj --configuration Release --no-restore

      - name: Publish unpackaged
        run: >
          dotnet publish windows/src/PulseMail.App/PulseMail.App.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Platform=x64
          -p:PublishSingleFile=false
          -p:WindowsPackageType=None
          -p:WindowsAppSDKSelfContained=true
          -o artifacts/PulseMail-native

      - name: Verify publish output
        shell: pwsh
        run: |
          $exe = "artifacts/PulseMail-native/PulseMail.App.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          Get-ChildItem artifacts/PulseMail-native -Name | Select-Object -First 40
          # Critical native deps for unpackaged WinUI
          $need = @(
            "Microsoft.WindowsAppRuntime.Release.Net.dll",
            "Microsoft.WinUI.dll",
            "e_sqlite3.dll"
          )
          foreach ($n in $need) {
            $hit = Get-ChildItem artifacts/PulseMail-native -Recurse -Filter $n -ErrorAction SilentlyContinue | Select-Object -First 1
            if (-not $hit) { Write-Warning "Missing optional/expected file: $n" }
            else { Write-Host "Found $($hit.FullName)" }
          }

      - name: Zip portable
        shell: pwsh
        run: |
          Compress-Archive -Path artifacts/PulseMail-native/* -DestinationPath artifacts/PulseMail-Native-1.0.2-win-x64.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Setup wizard
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer\PulseMail.iss
          Get-ChildItem artifacts\PulseMail-Native-*-Setup.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-mail-native-windows
          path: |
            artifacts/PulseMail-Native-1.0.2-Setup.exe
            artifacts/PulseMail-Native-1.0.2-win-x64.zip
          if-no-files-found: error

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-v1.0.2
          name: Pulse Mail Native 1.0.2
          body: |
            Eigenständige WinUI-3-App (kein Docker, kein Server).

            **Installer:** `PulseMail-Native-1.0.2-Setup.exe`
            Installiert nach `%LOCALAPPDATA%\Programs\PulseMail` (kein Admin nötig).

            **Falls die App nicht startet:** siehe `%LOCALAPPDATA%\PulseMail\startup.log`

            Beim ersten Start Postfach hinzufügen (IMAP oder OAuth).
          files: |
            artifacts/PulseMail-Native-1.0.2-Setup.exe
            artifacts/PulseMail-Native-1.0.2-win-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
