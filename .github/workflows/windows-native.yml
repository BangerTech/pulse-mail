name: Windows Native App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "windows/**"
      - ".github/workflows/windows-native.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4

      # Pin to .NET 8 — SDK 10 on windows-latest breaks WinAppSDK PRI tasks
      # (missing Microsoft.Build.Packaging.Pri.Tasks under sdk\10.0.x).
      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Setup VS MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Show SDK
        shell: pwsh
        run: |
          dotnet --info
          if (-not (Test-Path global.json)) { throw "windows/global.json missing" }
          Get-Content global.json

      - name: Restore
        run: dotnet restore PulseMail.sln

      - name: Test Core
        run: dotnet test src/PulseMail.Core.Tests/PulseMail.Core.Tests.csproj --configuration Release --no-restore

      # Publish via VS MSBuild so Appx/PRI tasks resolve from Visual Studio, not the .NET SDK tree.
      # Do NOT pass /p:TargetFramework or /restore here — global TFM overrides break
      # PulseMail.Core (net8.0) project.assets.json (NETSDK1005).
      - name: Publish unpackaged
        shell: pwsh
        run: |
          $out = Join-Path $env:GITHUB_WORKSPACE "artifacts\PulseMail-native"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          dotnet restore src\PulseMail.App\PulseMail.App.csproj -r win-x64
          msbuild src\PulseMail.App\PulseMail.App.csproj `
            /t:Publish `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /p:RuntimeIdentifier=win-x64 `
            /p:SelfContained=true `
            /p:PublishSingleFile=false `
            /p:WindowsPackageType=None `
            /p:WindowsAppSDKSelfContained=true `
            /p:PublishDir="$out\\" `
            /v:m

      - name: Verify publish output
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          $exe = "artifacts/PulseMail-native/PulseMail.App.exe"
          if (-not (Test-Path $exe)) { throw "Missing $exe" }
          Get-ChildItem artifacts/PulseMail-native -Name | Select-Object -First 40

      - name: Zip portable
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          Compress-Archive -Path artifacts/PulseMail-native/* -DestinationPath artifacts/PulseMail-Native-1.0.2-win-x64.zip -Force

      - name: Install Inno Setup
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: choco install innosetup -y --no-progress

      - name: Build Setup wizard
        shell: pwsh
        working-directory: ${{ github.workspace }}
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" windows\installer\PulseMail.iss
          Get-ChildItem artifacts\PulseMail-Native-*-Setup.exe | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: pulse-mail-native-windows
          path: |
            artifacts/PulseMail-Native-1.0.2-Setup.exe
            artifacts/PulseMail-Native-1.0.2-win-x64.zip
          if-no-files-found: error

      - name: Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-v1.0.2
          name: Pulse Mail Native 1.0.2
          body: |
            Eigenständige WinUI-3-App (kein Docker, kein Server).

            **Installer:** `PulseMail-Native-1.0.2-Setup.exe`
            Installiert nach `%LOCALAPPDATA%\Programs\PulseMail` (kein Admin nötig).

            **Falls die App nicht startet:** siehe `%LOCALAPPDATA%\PulseMail\startup.log`

            Beim ersten Start Postfach hinzufügen (IMAP oder OAuth).
          files: |
            artifacts/PulseMail-Native-1.0.2-Setup.exe
            artifacts/PulseMail-Native-1.0.2-win-x64.zip
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
