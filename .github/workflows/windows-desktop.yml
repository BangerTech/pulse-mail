name: Windows App

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "desktop/**"
      - ".github/workflows/windows-desktop.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Tauri CLI
        working-directory: desktop
        run: npm install

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          tauriScript: npm run tauri
          args: --bundles nsis
          tagName: v__VERSION__
          releaseName: Pulse Mail __VERSION__
          releaseBody: Windows-Installer. Beim ersten Start die Server-URL eintragen, z. B. http://192.168.2.83:8080
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: false

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: pulse-mail-windows
          path: desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: warn
