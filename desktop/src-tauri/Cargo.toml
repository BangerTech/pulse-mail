[package]
name = "pulse-mail-desktop"
version = "1.4.11",
description = "Pulse Mail Windows desktop shell"
authors = ["BangerTech"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "pulse_mail_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["image-png"] }
tauri-plugin-notification = "2"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
