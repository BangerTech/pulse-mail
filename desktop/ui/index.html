<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pulse Mail einrichten</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #1c1c1e;
      --card: #2c2c2e;
      --text: #f5f5f7;
      --muted: #a1a1a6;
      --accent: #0a84ff;
      --border: rgba(255, 255, 255, 0.12);
    }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 15px/1.45 system-ui, "Segoe UI", sans-serif;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px;
    }
    form {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 28px 26px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 22px; text-align: center; }
    p { margin: 0 0 6px; color: var(--muted); text-align: center; font-size: 13px; }
    label { display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: var(--muted); }
    input {
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    button {
      margin-top: 8px;
      border: 0;
      border-radius: 8px;
      padding: 11px 14px;
      background: var(--accent);
      color: #fff;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .error { color: #ff453a; font-size: 13px; margin: 0; text-align: center; }
  </style>
</head>
<body>
  <form id="form">
    <h1>Pulse Mail</h1>
    <p>Adresse deines Pulse-Mail-Servers. Danach öffnet die App den Login — ohne den alten Pake-Cache.</p>
    <label>
      Server-URL
      <input id="url" type="url" required placeholder="http://192.168.2.83:8080" value="http://192.168.2.83:8080" />
    </label>
    <p class="error" id="error" hidden></p>
    <button type="submit" id="go">Öffnen</button>
  </form>
  <script>
    const invoke = window.__TAURI__?.core?.invoke;
    const errorEl = document.getElementById('error');
    const input = document.getElementById('url');
    const button = document.getElementById('go');

    (async () => {
      if (!invoke) return;
      try {
        const saved = await invoke('get_server_url');
        if (saved) input.value = saved;
      } catch {}
    })();

    document.getElementById('form').addEventListener('submit', async (event) => {
      event.preventDefault();
      errorEl.hidden = true;
      if (!invoke) {
        errorEl.textContent = 'Tauri-API fehlt. Bitte die App neu bauen.';
        errorEl.hidden = false;
        return;
      }
      button.disabled = true;
      try {
        await invoke('save_server_url', { url: input.value.trim() });
      } catch (err) {
        errorEl.textContent = String(err?.message || err || 'Ungültige URL');
        errorEl.hidden = false;
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
